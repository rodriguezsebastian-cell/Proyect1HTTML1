<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>Keyboard Image & Sound Changer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #000000;
            color: white;
            text-align: center;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 40px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
        }

        #mainImage {
            width: 500px;
            max-width: 90%;
            height: auto;
            margin: 30px auto;
            display: block;
        }

        .instructions {
            margin-top: 20px;
            font-size: 18px;
        }

        .instructions span {
            display: inline-block;
            margin: 5px 15px;
        }

    </style>
</head>


<body>

    <h1>Keyboard Image & Sound Changer</h1>

    <p>
        Press A, S, D, F, G, H or J.
    </p>



    <img
        id="mainImage"
        src= "C:\Users\jlrgu\Downloads\TecladoInteractivo\Teclado.jpg"
        alt="Changing image"
    >



    <p class="instructions">

        <span>A = Do</span>
        <span>S = Re</span>
        <span>D = Mi</span>
        <span>F = Fa</span>
        <span>G = Sol</span>
        <span>H = La</span>
        <span>J = Si</span>

    </p>


    <script>

    
        const image = document.getElementById("mainImage");


        const soundA = new Audio(
            "Sounds/freesound_community-do-80236.mp3"
        );

        const soundS = new Audio(
            "Sounds/freesound_community-re-78500.mp3"
        );

        const soundD = new Audio(
            "Sounds/freesound_community-mi-80239.mp3"
        );

        const soundF = new Audio(
            "Sounds/freesound_community-fa-78409.mp3"
        );

        const soundG = new Audio(
            "Sounds/freesound_community-sol-101774.mp3"
        );

        const soundH = new Audio(
            "Sounds/freesound_community-la-80237.mp3"
        );

        const soundJ = new Audio(
            "Sounds/freesound_community-si-80238.mp3"
        );



        document.addEventListener("keydown", function(event) {

       
            if (event.key.toLowerCase() === "a") {

                image.src = "Images/DO.png";

                soundA.currentTime = 0;
                soundA.play();

            }


        

            else if (event.key.toLowerCase() === "s") {

                image.src = "Images/RE.png";

                soundS.currentTime = 0;
                soundS.play();

            }


        

            else if (event.key.toLowerCase() === "d") {

                image.src = "Images/MI.png";

                soundD.currentTime = 0;
                soundD.play();

            }


            else if (event.key.toLowerCase() === "f") {

                image.src = "Images/FA.png";

                soundF.currentTime = 0;
                soundF.play();

            }


            else if (event.key.toLowerCase() === "g") {

                image.src = "Images/SOL.png";

                soundG.currentTime = 0;
                soundG.play();

            }


            else if (event.key.toLowerCase() === "h") {

                image.src = "Images/LA.png";

                soundH.currentTime = 0;
                soundH.play();

            }



            else if (event.key.toLowerCase() === "j") {

                image.src = "Images/SI.png";

                soundJ.currentTime = 0;
                soundJ.play();

            }

        });

    </script>

</body>

</html>
